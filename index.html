.gLab{font-family:"Songti SC","STSong",serif;font-weight:900;color:#e2c487;margin-bottom:4px}
.gGrid{display:grid;gap:3px}.gBag{grid-template-columns:repeat(8,1fr)}
.cell{aspect-ratio:1;background:#0c0a08;border:1px solid #33291d;box-shadow:inset 0 0 8px rgba(0,0,0,.9);border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden}
.cell img,.gSlot img{pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.8))}.cell img{width:118%;max-width:none}
.cell.q1,.gSlot.q1{background:radial-gradient(circle,rgba(70,120,255,.38),#0c0a08 75%);border-color:#3c5aa8}
.cell.q2,.gSlot.q2{background:radial-gradient(circle,rgba(255,190,50,.4),#0c0a08 75%);border-color:#b08a2a}
.cell.nofit:after{content:'';position:absolute;inset:0;background:rgba(200,40,40,.24)}
.cell:hover,.gSlot:hover{outline:1px solid #e2c487}
.gFurn{position:relative;margin-top:12px;padding:10px;border-radius:8px;background:linear-gradient(180deg,rgba(110,40,10,.35),rgba(40,15,8,.4));border:1px solid #7a3e1c}
.gfT{font-family:"Songti SC","STSong",serif;font-weight:900;color:#ffc080}.gfT small{font-family:system-ui,sans-serif;font-weight:600;font-size:11px;color:#d8a88a;margin-left:6px}
.gfRow{display:flex;gap:12px;align-items:center;margin-top:6px}.gF{grid-template-columns:repeat(4,1fr);width:190px;flex:none}.gF .cell{border-color:#5a2e18;background:#140a06}
.gfSide{flex:1;display:flex;flex-direction:column;gap:8px;align-items:flex-start}.gfOdds{display:flex;flex-direction:column;gap:2px;font-weight:800;font-size:13px}.gfOdds .dim{color:#8f7a68;font-weight:600}
.gGo{height:36px;padding:0 18px;font-weight:900;background:linear-gradient(180deg,#c0582a,#7a2e12);border-color:rgba(255,170,110,.6)}
.gReel{position:absolute;inset:0;border-radius:8px;background:rgba(12,6,4,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.gReel .lt{font-weight:900;color:#ffc080}.gReel .ri{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:8px;border:2px solid #444;background:#0c0a08;min-width:200px}
.gReel .ri img{width:52px}.gReel .ri.q1{border-color:#5f9cff}.gReel .ri.q2{border-color:#ffc83a}.gReel .reel.done .ri{animation:pop .4s}.gReel .reel.done.q2 .ri{box-shadow:0 0 26px rgba(255,200,60,.7)}
.gReel .tN{font-weight:900}.gReel .ok{height:34px;padding:0 22px;font-weight:900}
.gInfo{margin:10px -16px -12px;min-height:22px;position:sticky;bottom:-12px;padding:8px 12px 10px;background:linear-gradient(180deg,rgba(18,14,11,.85),#120e0b 30%);border-top:1px solid #3a2e20}.gInfo .hint{font-size:11px;color:#9d8a6e;text-align:center}
.gInfo .hold{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:4px}.gInfo .hold img{width:56px}.gInfo .tip{text-align:left;background:none;border:none;padding:0}
#gTip{position:fixed;display:none;z-index:20;pointer-events:none}
.tip{background:rgba(8,6,5,.95);border:1px solid #5a4a30;padding:8px 14px;text-align:center;font-size:13px;line-height:1.45;min-width:170px}
.tN{font-weight:900;font-size:14px}.tB{color:#e8e2d6}.tI{color:#bfb6a6;font-size:12px}.tL{color:#7f98ff}.tR{color:#e8e2d6}.tR.bad{color:#ff5a5a}.tC{color:#c9b8a0;font-size:12px}.tC.up{color:#6dff8e}.tC.dn{color:#ff6b6b}
#gHeld{position:fixed;display:none;width:56px;height:56px;transform:translate(-50%,-50%);pointer-events:none;z-index:21}#gHeld img{width:100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.9))}
@media (max-width:700px){.gMain{grid-template-columns:1fr}#gDoll{width:140px;height:180px}.gSlot{width:56px;height:96px}#gearBox{padding:12px 10px}.gF{width:160px}}
@media (max-width:520px){#fps{display:none}#tr{max-width:calc(100vw - 196px);flex-wrap:wrap;justify-content:flex-end;gap:6px}#tr .lb{display:none}#tr .btn{height:38px}#bSfx,#bReset{width:38px}#bCrypt,#bGear{padding:0 8px}}
</style>
</head>

  <div id="me" class="panel"><div id="lvl">Lv 1 召唤师</div>
    <div class="bar"><i id="hpB"></i><span id="hpT"></span></div><div class="bar"><i id="mpB"></i><span id="mpT"></span></div><div class="bar xp"><i id="xpB"></i></div></div>
  <div id="party"></div>

  <div id="tr"><span id="fps">60</span><button class="btn" id="bReset" title="重置副本（测试）">↺</button><button class="btn" id="bSfx">🔊</button><button class="btn" id="bGear">🎒<span class="lb"> 装备</span> <b id="gearN">0</b></button><button class="btn" id="bCrypt">📜<span class="lb"> 墓典</span> <b id="cryptN">0</b></button></div>
